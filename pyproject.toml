[project]
name = "socialite"
version = "0.4.0"
description = "Socialite — pub-sub multi-agent social learning bot with A/B bidding"
readme = "CLAUDE.md"
requires-python = ">=3.10"
authors = [
    { name = "Socialite Team" }
]
keywords = ["ai", "agents", "social-learning", "multi-agent", "pub-sub"]

dependencies = [
    "qdrant-client>=1.12.0",
    "neo4j>=5.20.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "anthropic>=0.39.0",
    "openai>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

postgres = [
    "psycopg2-binary>=2.9.0",
]

all = [
    "socialite[dev,postgres]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "agents", "social_memory", "moltbook"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 100
