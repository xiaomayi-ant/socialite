version: '3.8'

services:
  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: social_memory_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=DEBUG
    restart: unless-stopped

  # Neo4j Knowledge Graph
  neo4j:
    image: neo4j:5.20.0-community
    container_name: social_memory_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ./data/neo4j:/data
      - ./data/neo4j/logs:/logs
    environment:
      - NEO4J_AUTH=neo4j/susie2023
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=512M
      - NEO4J_dbms_memory_pagecache_size=512m
    restart: unless-stopped

  # PostgreSQL (Optional - for structured storage)
  postgres:
    image: postgres:15-alpine
    container_name: social_memory_postgres
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=social_memory
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=your_password
    restart: unless-stopped

  # Optional: pgAdmin for PostgreSQL management
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: social_memory_pgadmin
  #   ports:
  #     - "5050:80"
  #   environment:
  #     - PGADMIN_DEFAULT_EMAIL=admin@example.com
  #     - PGADMIN_DEFAULT_PASSWORD=admin
  #   depends_on:
  #     - postgres
  #   restart: unless-stopped

volumes:
  qdrant_data:
  neo4j_data:
  postgres_data:

networks:
  default:
    name: social_memory_network
