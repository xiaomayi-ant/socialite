services:
  gost-tunnel:
    image: ginuerzh/gost
    container_name: socialite-gost-tunnel
    # Example:
    # GOST_FORWARD_URL=relay+tls://user:password@your-relay-host:8443
    command: -L=:1080 -F=${GOST_FORWARD_URL}
    restart: unless-stopped
    networks:
      - socialite-app

  socialite:
    image: ghcr.io/xiaomayi-ant/socialite:${SOCIALITE_IMAGE_TAG:-latest}
    pull_policy: always
    container_name: socialite-app
    restart: unless-stopped
    volumes:
      - ./moltbook:/root/.config/moltbook
    env_file:
      - .env
    depends_on:
      - gost-tunnel
    environment:
      HTTP_PROXY: http://gost-tunnel:1080
      HTTPS_PROXY: http://gost-tunnel:1080
      ALL_PROXY: http://gost-tunnel:1080
      NO_PROXY: localhost,127.0.0.1,gost-tunnel,qdrant-shared,postgres-db,neo4j-db
    command: python runner.py --interval ${RUN_INTERVAL_MINUTES:-30}
    networks:
      - socialite-app
      - ai-infra

networks:
  socialite-app:
    name: socialite-app
  # Shared infra network where qdrant-shared/postgres-db/neo4j-db are connected.
  # Create once: docker network create ai-infra
  ai-infra:
    external: true
